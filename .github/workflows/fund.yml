name: Fund run

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, after the US close, Monday to Friday
  workflow_dispatch:
    inputs:
      mode:
        description: "live = process the latest trading day · replay = rebuild the backtest"
        type: choice
        options: [live, replay]
        default: live
      days:
        description: "Replay length in trading days"
        default: "60"

permissions:
  contents: write

concurrency:
  group: fund
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'live' }}
      DAYS: ${{ inputs.days || '60' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fund/requirements.txt

      - run: pip install -r fund/requirements.txt

      - name: Harness tests (no trading if any fail)
        id: harness_tests
        working-directory: evaluation
        run: python -m pytest -q -p no:cacheprovider

      - name: Engine tests (no trading if any fail)
        id: engine_tests
        run: python -m pytest fund/tests -q -p no:cacheprovider

      - name: Run the fund
        id: fund
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m fund.engine.cli "$MODE" --days "$DAYS"

      - name: Record that tests blocked trading
        if: failure() && steps.fund.outcome == 'skipped'
        run: |
          mkdir -p fund/state
          python - <<'PY'
          import json, os, datetime
          json.dump({"mode": os.environ["MODE"], "ok": False,
                     "message": "no trading: a test failed, see the Actions log",
                     "run_at_utc": datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%d %H:%M")},
                    open(f"fund/state/status_{os.environ['MODE']}.json", "w"), indent=2)
          PY

      - name: Commit results to the repo
        if: always()
        run: |
          git config user.name "fund-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fund/state
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Fund $MODE run $(date -u +%F)"
          git pull --rebase
          git push
